name: macOS metadata guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-metadata-guard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tools/macos_hygiene.py check-git . --scope all
